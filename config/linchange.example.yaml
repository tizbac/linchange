# linchange configuration.
#
# This file is required: the server refuses to start without it, and
# `--config` is mandatory. Every value below is the built-in default unless
# noted otherwise, so a minimal deployment only needs database.url,
# auth.jwt.secret and a TLS certificate.
#
# ${VAR} is replaced with the value of that environment variable. A reference
# with no value and no ${VAR:-fallback} is a startup error, so a missing secret
# fails immediately rather than turning into a confusing runtime failure.

server:
  # Must have a DNS A record pointing at public_ip, and public_ip must have a
  # matching PTR record. Outbound mail is rejected by remote servers otherwise.
  hostname: localhost
  public_ip: 127.0.0.1
  data_dir: ./data
  # Reverse proxies in front of the HTTP listener. X-Forwarded-For is only
  # trusted from these ranges.
  trusted_proxies: []

database:
  url: postgres://linchange:linchange@127.0.0.1:5432/linchange?sslmode=disable
  max_open: 25
  max_idle: 5
  max_lifetime: 30m
  connect_timeout: 10s
  auto_migrate: true

listeners:
  # Inbound MTA. Unauthenticated, accepts only mail for local domains. When a
  # certificate is configured under `tls:` (ACME or a static pair), this port
  # also advertises STARTTLS so remote senders can encrypt the transfer.
  smtp_inbound: { addr: ":25" }
  # Submission. AUTH required, and only the authenticated user may send.
  smtp_submission: { addr: ":587" }
  imap: { addr: ":143" }
  # The three TLS-only listeners are refused at startup unless a certificate
  # is configured under `tls:`, because binding 465/993/995 without one would
  # advertise TLS and then fail the handshake. They are commented out here so
  # that a fresh checkout starts on plaintext ports alone; uncomment them once
  # you are serving real users.
  # imaps: { addr: ":993" }
  # pop3s: { addr: ":995" }
  # smtp_submission_tls: { addr: ":465" }
  pop3: { addr: ":110" }
  # Loopback LMTP, for tests and for putting an external MTA in front.
  lmtp: { addr: "" }
  http: { addr: ":8080" }
  https: { addr: "" }
  smtp_inbound_max_bytes: 52428800

tls:
  # Either a static pair, or ACME below. Not both.
  #
  # The paths below are what `make dev-certs` generates, so a checkout works
  # out of the box. A production deployment must replace them with a real
  # certificate, or enable the ACME block instead.
  cert_file: .certs/cert.pem
  key_file: .certs/key.pem
  # Answer plain HTTP with a permanent redirect to HTTPS. ACME HTTP-01
  # challenges are exempt, so certificates can still be obtained or renewed.
  # Only takes effect when listeners.https is set.
  redirect_http: true
  acme:
    enabled: false
    email: ""
    domains: []
    cache_dir: ./data/acme

auth:
  # Encrypts second-factor secrets at rest. Required whenever totp.enabled is
  # on, which is the default. Deliberately not the same key as the DKIM one:
  # sharing it would mean rotating either key breaks the other.
  # Generate with: openssl rand -base64 32
  encryption_key: ${AUTH_ENCRYPTION_KEY}
  local:
    # OWASP password storage recommendation.
    argon2:
      memory_kib: 65536
      iterations: 3
      parallelism: 4
      salt_len: 16
      key_len: 32
    min_password_length: 12
  jwt:
    # Required, at least 32 characters. Changing it invalidates all sessions.
    secret: ${JWT_SECRET}
    issuer: linchange
    access_ttl: 15m
    refresh_ttl: 720h
  totp:
    # Applies to local and LDAP users alike. The directory does not provide a
    # second factor, so secrets are held here, encrypted at rest.
    enabled: true
    issuer: linchange
    # Periods either side of now that also verify, for clock skew.
    window: 1
    recovery_codes: 10
  reset_password:
    # Local users only. An LDAP user's password is changed in the directory.
    enabled: true
    token_ttl: 30m
  # Repeated authentication failures are counted per account and per source
  # address, and both limits are enforced. Either alone leaves a way through: an
  # account limit cannot see one host spraying many accounts, and an address
  # limit cannot see a slow guess at one account from many hosts.
  lockout:
    account:
      # Failures tolerated inside the window before the account is locked. This
      # is the limit that actually protects a single mailbox, so it is strict.
      max_attempts: 5
      window: 15m
      # How long the lock lasts. Must not exceed the window, or the lock would
      # lift before the failures covering it had aged out.
      duration: 15m
    ip:
      # Looser than the account limit, but only by a factor of two, and the lock
      # is half as long. This is the threshold that can lock out a whole office
      # behind one egress address, so it is worth understanding what it counts:
      # failures only, from a single address, inside the window. Ten genuine
      # failures in fifteen minutes is a spray, not a busy morning.
      #
      # Raising it much further would be no limit at all; lowering it much
      # further would cost a building its mail for half an hour over a few
      # mistyped passwords. The account limit is what protects one mailbox.
      max_attempts: 10
      window: 15m
      duration: 30m
  # Mail clients, CalDAV, CardDAV, EWS, EAS and MAPI cannot present a TOTP
  # code, so they have their own failure counter. It is keyed by the login
  # being guessed: after ten wrong passwords inside the window, that login is
  # refused for the duration. Successful authentication clears the count.
  # Set max_attempts to 0 to disable this limit.
  protocol_lockout:
    max_attempts: 10
    window: 5m
    duration: 5m
  # A user with a second factor gets an opaque challenge after the password
  # checks out, not tokens. Nothing usable exists until the code is presented,
  # so a challenge left in a browser tab is worthless by the time anyone comes
  # back. Long enough to find a phone and read a code; little more.
  challenge:
    ttl: 5m
  session:
    idle_timeout: 30m
    absolute_timeout: 12h
  impersonation:
    allowed: true
    # Forces the domain admin to state a reason, which is written to the audit
    # log alongside the impersonated user.
    require_reason: true
    # Requires an impersonation_grants row naming the user, so an admin can act
    # as one named colleague rather than as anybody. The grant can be given an
    # expiry and revoked without touching this file. With it off, allowed is a
    # blanket power over every account.
    require_grant: true

ldap:
  providers: []
  #   - name: corp
  #     url: ldaps://dc1.corp.example.com:636
  #     start_tls: false
  #     bind_dn: "CN=svc-linchange,OU=Service,DC=corp,DC=example,DC=com"
  #     bind_password: ${LDAP_BIND_PASSWORD}
  #     base_dn: "OU=Users,DC=corp,DC=example,DC=com"
  #     user_filter: "(&(objectClass=user)(mail={{username}}))"
  #     attributes:
  #       mail: [mail, proxyAddresses, targetAddress]
  #       display_name: [displayName, cn]
  #       member_of: [memberOf]
  #     # An AD user whose mail attribute is not in a hosted domain is refused
  #     # unless they are a member of this group, in which case they get a
  #     # domain_admin account with no mail functionality. Required.
  #     domain_admins_group_dn: "CN=Domain Admins,CN=Users,DC=corp,DC=example,DC=com"
  #     mailbox_quota_bytes: 10737418240
  #     default_domain: ""
  #     timeout: 10s
  #
  # sync:
  #   enabled: false
  #   interval: 15m
  #   disable_missing_after: 72h
  #   page_size: 500
  # cache_ttl: 5m

mail:
  submission:
    # Refuse AUTH on a connection that has not been upgraded with STARTTLS.
    require_tls: true
    # Only ever for debugging against a plaintext sink.
    allow_insecure_auth: false
    # Reject any MAIL FROM that is not the authenticated user or one of their
    # verified aliases.
    enforce_sender_identity: true
    # Messages per user per UTC day. 0 disables the cap.
    daily_send_limit: 500
    daily_send_limit_overridable: true
  inbound:
    enabled: true
    # Refuse mail for addresses with no matching user, alias or shared
    # mailbox, rather than accepting it and bouncing later.
    reject_unknown_recipients: true
    max_recipients: 100
    greylisting:
      # First contact from an unknown sender is deferred. Real senders retry;
      # most spam does not.
      enabled: true
      delay: 5m
      expiry: 4h
      retry_window: 30m
    spam:
      enabled: true
      junk_threshold: 5.0
      reject_threshold: 12.0
  outbound:
    concurrency: 4
    per_domain_concurrency: 2
    retry:
      max_attempts: 12
      backoff_base: 5m
      backoff_max: 12h
      max_lifetime: 168h
    dsn:
      enabled: true
      # Wait this long after the final failure before bouncing, so a
      # transiently broken remote host has time to recover.
      delay: 4h
      # Envelope sender of generated bounces. Must be a real address at a
      # domain you control, or remote servers will reject the DSN.
      from_address: postmaster@example.com
    connect_timeout: 10s
    command_timeout: 2m
    # Default smart host for outbound delivery. If empty, MX lookup is used.
    # smtp_host: mail.example.com
    # smtp_port: 587
    # smtp_starttls: true
    # smtp_username: ""
    # smtp_password: ""
  dkim:
    selector_prefix: s
    key_bits: 2048
    sign_all: true
  # Encrypts DKIM private keys at rest. Required when dkim.sign_all is on.
  dkim_private_key_encryption_key: ${DKIM_ENCRYPTION_KEY}
  # Inherited by new mailboxes. 0 would mean unlimited; the schema treats NULL
  # as "inherit from the domain".
  default_quota_bytes: 10737418240
  # Ceiling on what a domain admin may grant.
  max_quota_bytes: 107374182400
  recipients_per_message: 100
  max_message_bytes: 52428800

exchange:
  enabled: true
  # Reported to clients by Autodiscover and EWS. Required.
  organization: Example Ltd
  autodiscover:
    enabled: true
    path: /autodiscover/autodiscover.xml
  ews:
    enabled: true
    path: /ews/exchange.asmx
  eas:
    enabled: true
    path: /eas
    max_ping_interval: 3540
    max_sync_items: 512
  # Ports Autodiscover tells clients to connect to. Leave every one of them at
  # 0 - the default - when this server is reached on the standard ports. Set
  # them only when the host publishes the listeners elsewhere, such as a
  # container mapping 143 to 5143 or a reverse proxy in front of 443.
  advertised:
    imap: 0
    imaps: 0
    pop3: 0
    pop3s: 0
    smtp: 0
    smtps: 0
    submission: 0
    http: 0
    https: 0

# Calls between meeting participants use WebRTC. linchange runs its own
# STUN/TURN server by default, so a single install is enough. STUN lets two
# browsers find each other; TURN relays the media when they cannot connect
# directly (a symmetric NAT or a corporate firewall).
#
# Required ports when the built-in server is enabled:
#   3478/udp and 3478/tcp        STUN and TURN
#   49152-49251/udp              relay allocations; every port in the
#                                configured range must be reachable
# The HTTP/HTTPS port of the web app is required as before.
webrtc:
  # To use an external STUN/TURN server instead, name it here. This replaces
  # the built-in server and its credentials. A STUN entry needs only urls; a
  # TURN entry also needs the long-term username and credential.
  # ice_servers:
  #   - urls:
  #       - "stun:turn.example.com:3478"
  #       - "turn:turn.example.com:3478?transport=udp"
  #     username: "linchange"
  #     credential: "${TURN_PASSWORD}"
  turn:
    # On by default. Set false only when ice_servers above supplies the relay,
    # or when calls are not used at all.
    enabled: true
    realm: linchange
    listen: { addr: ":3478" }
    relay_min_port: 49152
    relay_max_port: 49251
    # The address clients use to reach the relay. It must be an address the
    # browsers can route to, not the bind address; empty falls back to
    # server.public_ip.
    external_ip: ""
    # The name put in the URLs handed to browsers; empty uses external_ip.
    host: ""
    # Signs the short-lived TURN credentials. Empty generates a random secret
    # at startup, which invalidates credentials on restart; set a stable value
    # to keep them valid across restarts.
    secret: ""
    credential_ttl: 2h

logging:
  level: info
  format: json
  file: ""
  audit: true
  audit_retain: 8760h
