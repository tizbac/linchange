# docker-compose.yml - for development and testing
# 
# Usage:
#   docker compose up -d                    # production-like
#   docker compose --profile demo up -d     # demo with auto-config
#   docker compose logs -f linchange
#
# The database password should be set via environment variable or .env file

services:
  postgres:
    image: postgres:18-alpine
    container_name: linchange-postgres
    environment:
      POSTGRES_USER: linchange
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linchange}
      POSTGRES_DB: linchange
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linchange"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - linchange-network

  linchange:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linchange
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database
      DB_PASSWORD: ${POSTGRES_PASSWORD:-linchange}
      # JWT secret - CHANGE IN PRODUCTION
      JWT_SECRET: ${JWT_SECRET:-changeme-in-production-use-long-random-string}
      # LDAP bind password (if using LDAP)
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
    volumes:
      # Config file (required)
      - ./config/linchange.yaml:/app/config/linchange.yaml:ro
      # Data directory for blobstore, ACME certs, etc.
      - linchange_data:/var/lib/linchange
    ports:
      # Mail protocols
      - "25:25"      # SMTP inbound (requires root/privileged)
      - "587:587"    # SMTP submission
      - "465:465"    # SMTP submission TLS
      - "143:143"    # IMAP
      - "993:993"    # IMAPS
      - "110:110"    # POP3
      - "995:995"    # POP3S
      # HTTP
      - "8080:8080"  # HTTP
      - "8443:8443"  # HTTPS
    networks:
      - linchange-network
    restart: unless-stopped
    profiles: ["production"]

  linchange-demo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linchange-demo
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_PASSWORD: ${POSTGRES_PASSWORD:-linchange}
      JWT_SECRET: ${JWT_SECRET:-changeme-in-production-use-long-random-string}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
    volumes:
      # Demo config generated by run-demo.sh
      - ./config/linchange.demo.yaml:/app/config/linchange.demo.yaml:ro
      - linchange_data:/var/lib/linchange
    ports:
      - "25:25"
      - "587:587"
      - "465:465"
      - "143:143"
      - "993:993"
      - "110:110"
      - "995:995"
      - "8080:8080"
      - "8443:8443"
    networks:
      - linchange-network
    restart: unless-stopped
    profiles: ["demo"]
    command: ["--config", "/app/config/linchange.demo.yaml"]

volumes:
  postgres_data:
  linchange_data:

networks:
  linchange-network:
    driver: bridge