# docker-compose.yml - for development and testing
# 
# Usage:
#   docker compose up -d                    # production-like
#   docker compose --profile demo up -d     # demo with auto-config
#   docker compose logs -f linchange
#
# The database password should be set via environment variable or .env file

services:
  postgres:
    image: postgres:18-alpine
    container_name: linchange-postgres
    environment:
      POSTGRES_USER: linchange
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set to a strong random value}
      POSTGRES_DB: linchange
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      # Published to the loopback interface only, for the Go integration
      # tests. Do not expose PostgreSQL on a public interface.
      - "127.0.0.1:${LINCHANGE_TEST_PG_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linchange"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - linchange-network

  linchange:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linchange
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set to a strong random value}
      # JWT secret - required; there is deliberately no fallback, because a
      # public default signs tokens anyone can forge.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to at least 32 random bytes}
      # Encrypt TOTP secrets and DKIM keys at rest. Required by the example
      # config; generate each with: openssl rand -base64 32
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY:-}
      DKIM_ENCRYPTION_KEY: ${DKIM_ENCRYPTION_KEY:-}
      # LDAP bind password (if using LDAP)
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
    volumes:
      # Config file (required)
      - ./config/linchange.yaml:/app/config/linchange.yaml:ro
      # Data directory for blobstore, ACME certs, etc.
      - linchange_data:/var/lib/linchange
    ports:
      # Mail protocols. Host ports are deliberately non-standard - the standard
      # port with a 5 in front - so a development box can run this next to its
      # own mail server without binding the privileged ports. The container side
      # stays standard. Override any of these with the matching variable.
      - "${LINCHANGE_SMTP_PORT:-5025}:25"               # SMTP inbound
      - "${LINCHANGE_SUBMISSION_PORT:-5587}:587"        # SMTP submission
      - "${LINCHANGE_SMTPS_PORT:-5465}:465"             # SMTP submission TLS
      - "${LINCHANGE_IMAP_PORT:-5143}:143"              # IMAP
      - "${LINCHANGE_IMAPS_PORT:-5993}:993"             # IMAPS
      - "${LINCHANGE_POP3_PORT:-5110}:110"              # POP3
      - "${LINCHANGE_POP3S_PORT:-5995}:995"             # POP3S
      # HTTP
      - "${LINCHANGE_HTTP_PORT:-58080}:8080"            # HTTP
      - "${LINCHANGE_HTTPS_PORT:-58443}:8443"           # HTTPS
      # STUN/TURN for calls. The relay range must match
      # webrtc.turn.relay_min_port/max_port in the config; every port in it
      # must be reachable over UDP.
      - "${LINCHANGE_TURN_PORT:-3478}:3478/udp"
      - "${LINCHANGE_TURN_PORT:-3478}:3478/tcp"
      - "49152-49251:49152-49251/udp"
    networks:
      - linchange-network
    restart: unless-stopped
    profiles: ["production"]

  linchange-demo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linchange-demo
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set to a strong random value}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to at least 32 random bytes}
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY:?AUTH_ENCRYPTION_KEY must be set}
      DKIM_ENCRYPTION_KEY: ${DKIM_ENCRYPTION_KEY:?DKIM_ENCRYPTION_KEY must be set}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
    volumes:
      # Demo config generated by run-demo.sh
      - ./config/linchange.demo.yaml:/app/config/linchange.demo.yaml:ro
      - linchange_data:/var/lib/linchange
    ports:
      # Same non-standard host ports as the production-like service above, so
      # the two profiles cannot collide.
      - "${LINCHANGE_SMTP_PORT:-5025}:25"
      - "${LINCHANGE_SUBMISSION_PORT:-5587}:587"
      - "${LINCHANGE_SMTPS_PORT:-5465}:465"
      - "${LINCHANGE_IMAP_PORT:-5143}:143"
      - "${LINCHANGE_IMAPS_PORT:-5993}:993"
      - "${LINCHANGE_POP3_PORT:-5110}:110"
      - "${LINCHANGE_POP3S_PORT:-5995}:995"
      - "${LINCHANGE_HTTP_PORT:-58080}:8080"
      - "${LINCHANGE_HTTPS_PORT:-58443}:8443"
      # The demo's STUN/TURN matches config/linchange.demo.yaml.
      - "53478:53478/udp"
      - "53478:53478/tcp"
      - "49252-49352:49252-49352/udp"
    networks:
      - linchange-network
    restart: unless-stopped
    profiles: ["demo"]
    command: ["--config", "/app/config/linchange.demo.yaml", "--web-dir", "/app/static"]

volumes:
  postgres_data:
  linchange_data:

networks:
  linchange-network:
    driver: bridge