@if (ready()) {
  <div class="min-h-screen bg-slate-50">
    @if (auth.isAuthenticated()) {
      <header class="border-b border-slate-200 bg-white">
        <div class="mx-auto flex max-w-4xl items-center justify-between px-6 py-3">
          <span class="text-lg font-semibold tracking-tight text-brand-700">linchange</span>
          <div class="flex items-center gap-4">
            <span class="text-sm text-slate-600">{{ auth.user() }}</span>
            <button
              (click)="signOut()"
              class="rounded-lg border border-slate-300 px-3 py-1.5 text-sm font-medium text-slate-700 transition hover:bg-slate-100"
            >
              Sign out
            </button>
          </div>
        </div>
      </header>
    }
    <router-outlet />
  </div>
} @else {
  <div class="flex min-h-screen items-center justify-center bg-slate-50">
    <div
      class="h-8 w-8 animate-spin rounded-full border-2 border-brand-600 border-t-transparent"
      aria-label="Loading"
    ></div>
  </div>
}
